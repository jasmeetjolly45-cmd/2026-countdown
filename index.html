<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year Progress Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="widget-box">
    <!-- Year Title -->
    <div id="year-title" class="header-title">2026</div>
    
    <div class="ornament-row">
        <span class="line"></span>
        <span class="leaf">🌿</span>
        <span class="line"></span>
    </div>

    <!-- Progress Bar -->
    <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
    </div>

    <!-- Percentage Stat -->
    <div class="percentage-number"><span id="percent-count">0</span>%</div>
    <div class="percentage-label">OF THE YEAR COMPLETE</div>

    <!-- Day Counter Stat -->
    <div class="days-stat">
        <span id="day-of-year">0</span> <span class="slash">/</span> <span id="total-days">365</span> <span class="days-text">DAYS</span>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
